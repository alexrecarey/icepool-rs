[package]
name = "icepool-khepri"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "khepri-f2f's Face to Face dice engine (f2f.py) on the typed icepool core: application code, not part of the library"
publish = false

[dependencies]
icepool-core = { path = "../icepool-core" }
# The engine input and `calculate`'s output are JSON. arbitrary_precision: exact big integers in `rolls`.
serde_json = { version = "1", features = ["arbitrary_precision"] }
# The core's big integers: `rolls` and the quantities behind each `chance`.
dashu-int = "0.6"
rustc-hash = "2"
