[package]
name = "icepool-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rust port of the icepool dice probability library"

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
# Big integers: inline storage up to 128 bits, so the common small quantity never allocates (see NOTES.md).
dashu-base = "0.6"
dashu-int = "0.6"
dashu-ratio = "0.6"
rustc-hash = "2"

[[bin]]
name = "icepool-run"
path = "src/bin/icepool-run.rs"
