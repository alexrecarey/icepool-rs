[package]
name = "icepool-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rust port of the icepool dice probability library"

[dependencies]
# Big integers: inline storage up to 128 bits, so the common small quantity never allocates (see docs/NOTES.md).
dashu-base = "0.6"
dashu-int = "0.6"
dashu-ratio = "0.6"
rustc-hash = "2"

# No features: the library alone. khepri's engine is test-only, in the harness (crates/icepool-harness/src/f2f.rs).
