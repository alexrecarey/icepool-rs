[package]
name = "icepool-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Python (PyO3) extension icepool_rs: the Rust core behind the python/icepool facade"

[lib]
name = "icepool_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Without khepri's engine (icepool-core's default `khepri` feature): it is not part of the library.
icepool-core = { path = "../icepool-core", default-features = false }
dashu-int = "0.6"
dashu-ratio = "0.6"
pyo3 = "0.29"
