[package]
name = "icepool-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WASM (JS) facade over icepool-core, for the npm package icepool-wasm"

[lib]
# cdylib for wasm-pack; rlib so the native workspace build, test and clippy cover it too.
crate-type = ["cdylib", "rlib"]

[dependencies]
icepool-core = { path = "../icepool-core" }
# Interim, until task C6l: the TypeScript API's bridge (src/facade.rs under js/src/rpc.ts) calls the program
# runner's nodes by name for what is not on typed exports yet, so the npm package still links the runner
# (scripts/check-production.sh reports this as INTERIM). Without its default `khepri`: the npm package has no
# khepri engine. C6l moves the bridge behind the test-only `runner` feature, and this becomes optional.
icepool-harness = { path = "../icepool-harness", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision"] }
# The core's big integers and fractions, converted to and from JS BigInts (src/api/convert.rs).
dashu-int = "0.6"
dashu-ratio = "0.6"
# Only wasm-bindgen itself: the few JS globals we need (JSON, BigInt, Reflect) are declared below, not via js-sys.
wasm-bindgen = "0.2"
# khepri's engine, for `calculate` (feature `khepri`).
icepool-khepri = { path = "../icepool-khepri", optional = true }

[dev-dependencies]
# The unit tests of `run` and `calculate` run in every test build, whatever the features (src/lib.rs).
icepool-khepri = { path = "../icepool-khepri" }
icepool-harness = { path = "../icepool-harness" }

[features]
# None default: the npm package (js/build.sh) is built without either.
# The `run` export, test-only: run-wasm.sh drives the fixtures and the fuzzer through it.
runner = []
# The `calculate` export: khepri's engine, for khepri's own build (build.sh).
khepri = ["dep:icepool-khepri", "icepool-harness/khepri"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
