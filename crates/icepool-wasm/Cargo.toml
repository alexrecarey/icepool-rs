[package]
name = "icepool-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WASM (JS) facade over icepool-core, for the npm package icepool-wasm"

[lib]
# cdylib for wasm-pack; rlib so the native workspace build, test and clippy cover it too.
crate-type = ["cdylib", "rlib"]

[dependencies]
icepool-core = { path = "../icepool-core" }
# The program runner, test-only (feature `runner`): `run` and the JSON-op bridge the JS fixture tests use
# (src/facade.rs under js/src/rpc.ts).
icepool-harness = { path = "../icepool-harness", optional = true }
# JSON for the runner's programs (feature `runner`).
serde_json = { version = "1", features = ["arbitrary_precision"], optional = true }
# The core's big integers and fractions, converted to and from JS BigInts (src/api/convert.rs).
dashu-int = "0.6"
dashu-ratio = "0.6"
# Only wasm-bindgen itself: the few JS globals we need are declared where they are used, not via js-sys.
wasm-bindgen = "0.2"

[dev-dependencies]
# The unit tests of `run` and the bridge run in every test build, whatever the features (src/lib.rs).
icepool-harness = { path = "../icepool-harness" }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[features]
# None default: the npm package (js/build.sh) is built without it.
# The program runner, test-only: the `run` export (run-wasm.sh drives the fixtures and the fuzzer through it) and the
# JSON-op bridge (`call`, `from_wire`, `wire_result`, ...: the JS fixture tests, js/build.sh --test).
runner = ["dep:icepool-harness", "dep:serde_json"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
